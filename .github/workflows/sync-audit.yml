name: Parchment remote sync audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: parchment-sync-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify sync engine
        run: bash -n scripts/sync-all.sh

      - name: Audit public mirror SHAs
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for pair in \
            "GitCode|https://gitcode.com/jaminliu89/parchment-design-system.git" \
            "Gitee|https://gitee.com/jaminliu89/parchment-design-system.git"; do
            name="${pair%%|*}"
            url="${pair#*|}"
            sha="$(git ls-remote "$url" refs/heads/main | awk '{print $1}')"
            test -n "$sha" || { echo "FAIL: $name returned no SHA"; exit 1; }
            test "$sha" = "$EXPECTED_SHA" || { echo "FAIL: $name diverged"; exit 1; }
            echo "PASS: $name ${sha:0:12}"
          done

      - name: Summary
        run: echo "STATUS: mirrors match GitHub main"
