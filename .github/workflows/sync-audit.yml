name: Parchment quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parchment-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify generated artifacts, registry and runtime
        run: npm run check

      - name: Reject retired Parchment language in canonical runtime
        run: |
          set -euo pipefail
          targets=(README.md docs/ARCHITECTURE.md docs/PRD.md docs/MASTER-TASK.md docs/COMPONENT-CONTRACTS.md parchment.css src)
          if grep -RInE \
            '云雾白|石墨蓝|#F6F7F9|#5A6590|Parchment 3\.|Parchment v[123]' \
            "${targets[@]}"; then
            echo 'Retired Parchment design language detected in canonical/runtime sources.'
            exit 1
          fi
